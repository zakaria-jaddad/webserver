server 
{
    listen 0.0.0.0:8080;
    server_name LocalHOSt;
    client_max_body_size 10m;

    root ./www;
    index index.html;

    error_page 404 500 www/index.html;

    location / {
      upload_store /home/yhossni/Desktop/ft_webserver/www/uploads;
    }
    
    location /cgi-bin {
      upload_store /home/yhossni/Desktop/ft_webserver/www/;
      cgi .php /usr/bin/php-cgi;
      cgi .py /usr/bin/python3;
      autoindex on;
    }
}
