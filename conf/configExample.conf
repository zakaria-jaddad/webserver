server 
{
    listen 0.0.0.0:8080;
    server_name LocalHOSt;
    client_max_body_size 1048576;

    root ./www;
    index index.html;

    location / {
      upload_store /home/yhossni/Desktop/ft_webserver/www/uploads;
    }
    
    location /cgi-bin {
      root ./;
      cgi .php /usr/bin/php-cgi;
      cgi .py /usr/bin/python3;
      autoindex on;
    }

    location /php {
      cgi .php /usr/bin/php-cgi;
      cgi .py /usr/bin/python3;
      autoindex on;
    }

    location /folder {
      autoindex on;
    }

    location /pages {
      root .;
      index 200_delete.html;
    }

    location /takeme-home {
      return 301 /index.html ;
    }
}

