server {
    listen 127.0.0.1:2010;
    server_name test.local;
    root ./www;
    index index.html;
    client_max_body_size 10m;

    location / {
        upload_store /webserv/test_uploads/2010;
        allow GET POST DELETE;
    }

    location /uploads {
        upload_store /webserv/test_uploads/2010;
        allow GET POST DELETE;
        autoindex on;
    }

    location /cgi-bin {
        cgi .php /usr/bin/php-cgi;
        cgi .py /usr/bin/python3;
        autoindex on;
    }

    location /folder {
        autoindex on;
    }
}

server {
    listen 127.0.0.1:2011;
    server_name other.local;
    root ./www/sites;
    index test.html;

    location / {
        allow GET;
    }
}

server {
    listen 127.0.0.1:2012;
    server_name redir.local;
    root ./www;
    index index.html;

    location /old {
        return 301 /;
    }
}
