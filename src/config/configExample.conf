
server 
{
    listen 0.0.0.0:8080;
    server_name LocalHOSt;

    root ./www;
    index index.html;

    client_max_body_size 1g;

    error_page 505 420 404 /404.html;

    location /images {
      root ./wwadsaddw;
      index indeadsadx.html;
      client_body_temp_path /kjhkj;
      autoindex on;
      allow POST GET;

      return 302 /loc.com;
    }
    
