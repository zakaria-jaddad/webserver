<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime-Style GIF Page</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: "Comic Sans MS", cursive, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #4b0082;
            font-size: 3em;
            text-shadow: 2px 2px #ffb6c1;
        }
        .gif-container img {
            border: 6px solid #fff;
            border-radius: 20px;
            max-width: 80%;
            height: auto;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #4b0082;
        }
    </style>
</head>
<body>

    <h1>Welcome to Anime World Niggaaaaaaaaa🌸</h1>

    <div class="gif-container">
        <img src="http://media.giphy.com/media/a6pzK009rlCak/giphy.gif" alt="Anime Girl GIF">
    </div>

    <div class="footer">
        <p>Enjoy your anime vibe! ✨</p>
    </div>

    <h2>Login Form</h2>

    <form action="/upload" method="post" enctype="multipart/form-data">
      <label for="username">Username:</label><br>
      <input type="text" id="username" name="username" required><br><br>

      <label for="password">Password:</label><br>
      <input type="password" id="password" name="password" required><br><br>

<input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
<label for="vehicle1"> I have a bike</label><br>
<input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
<label for="vehicle2"> I have a car</label><br>
<input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
<label for="vehicle3"> I have a boat</label><br>

      <input type="file" name="profile" required><br><br>

      <input type="submit" value="Login">
    </form>

</body>
</html>
