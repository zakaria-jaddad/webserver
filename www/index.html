<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kessoku SERVER</title>

    <link
      rel="icon"
      type="image/jpeg"
      href="/sites/resources/bocchi_icon.jpg"
    />

    <style>
      /* ==========================================================================
     1. VARIABLES & RESET
     ========================================================================== */
      :root {
        --pink-bocchi: #ffb1cb;
        --blue-kita: #82e3f5;
        --yellow-nijika: #fff176;
        --purple-ryo: #b39ddb;
        --dark-punk: #121212;
        --white-paper: #f4f4f4;
        --neon-magenta: #ff007f;
      }
      body {
        margin: 0;
        font-family: "Courier New", Courier, monospace;
      }

      .hero-section {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background-color: var(--dark-punk);
        color: var(--white-paper);
        overflow: hidden;
        display: flex;
        align-items: center;
        padding: 4rem 2rem;
        font-family: "Courier New", Courier, monospace;
      }

      /* ==========================================================================
     2. TEXTURES & BACKGROUND LAYER
     ========================================================================== */
      .hero-bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.15;
      }

      /* Simulated Halftone Pattern */
      .halftone-pattern {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          var(--white-paper) 15%,
          transparent 16%
        );
        background-size: 12px 12px;
      }

      /* Gritty Grunge Line Texture */
      .distressed-texture {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(18, 18, 18, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 255, 0.02),
            rgba(0, 0, 255, 0.06)
          );
        background-size:
          100% 4px,
          6px 100%;
      }

      /* ==========================================================================
     3. LAYOUT CONTAINER
     ========================================================================== */
      .hero-container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 4rem;
        align-items: center;
      }

      @media (min-width: 992px) {
        .hero-container {
          grid-template-columns: 1.2fr 1fr;
        }
      }

      /* ==========================================================================
     4. LEFT COLUMN: CHAOTIC TYPOGRAPHY
     ========================================================================== */
      .hero-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      /* Ransom Note Badge */
      .ransom-note {
        background-color: var(--neon-magenta);
        color: var(--dark-punk);
        padding: 0.5rem 1rem;
        font-weight: 900;
        text-transform: uppercase;
        transform: rotate(-3deg);
        box-shadow: 4px 4px 0px var(--white-paper);
        margin-bottom: 2rem;
        font-size: 1.1rem;
      }

      /* Jagged Layered Title */
      .hero-title {
        font-size: clamp(3.5rem, 8vw, 6rem);
        font-weight: 900;
        line-height: 0.85;
        text-transform: uppercase;
        margin-bottom: 2rem;
        display: flex;
        flex-direction: column;
      }

      .hero-title span {
        display: inline-block;
        width: max-content;
        padding: 0.2rem 0.8rem;
      }

      .text-layer-1 {
        background-color: var(--pink-bocchi);
        color: var(--dark-punk);
        transform: rotate(-1deg) skewX(-5deg);
      }

      .text-layer-2 {
        background-color: var(--white-paper);
        color: var(--dark-punk);
        transform: rotate(2deg) translateX(10px);
        border: 3px solid var(--dark-punk);
      }

      .text-layer-3 {
        background-color: var(--dark-punk);
        color: var(--blue-kita);
        text-shadow: 4px 4px 0px var(--neon-magenta);
        transform: rotate(-2deg) translateY(-5px);
      }

      .hero-description {
        font-size: 1.1rem;
        line-height: 1.6;
        max-width: 480px;
        margin-bottom: 2.5rem;
        color: #ccc;
        background: rgba(18, 18, 18, 0.7);
        padding: 0.5rem;
        border-left: 4px solid var(--purple-ryo);
      }

      /* Punk Rock Buttons */
      .hero-actions {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        padding: 1rem 2rem;
        font-weight: bold;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .btn-primary {
        background-color: var(--yellow-nijika);
        color: var(--dark-punk);
        border: 3px solid var(--dark-punk);
        box-shadow: 5px 5px 0px var(--pink-bocchi);
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--white-paper);
        border: 3px dashed var(--white-paper);
      }

      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0px var(--neon-magenta);
      }

      .btn:active {
        transform: translate(3px, 3px);
        box-shadow: 0px 0px 0px transparent;
      }

      /* ==========================================================================
     5. RIGHT COLUMN: OVERLAPPING COLLAGE (THE MAGIC)
     ========================================================================== */
      .hero-collage {
        position: relative;
        width: 100%;
        height: 450px; /* Binds absolute items to a box container */
        margin-top: 2rem;
      }

      @media (min-width: 992px) {
        .hero-collage {
          height: 550px;
          margin-top: 0;
        }
      }

      .collage-item {
        position: absolute;
        transition: transform 0.3s ease;
      }

      .collage-item img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
      }

      /* Layer 1: Background Gig Poster */
      .poster-layer {
        top: 10%;
        left: 5%;
        width: 75%;
        z-index: 10;
        transform: rotate(-6deg);
        filter: grayscale(1) contrast(1.5);
        border: 2px solid var(--dark-punk);
        /* Rough ripped paper clip path */
        /* clip-path: polygon(2% 0%, 98% 4%, 100% 94%, 95% 100%, 5% 98%, 0% 85%); */
      }

      /* Layer 2: Midground Polaroid Frame */
      .polaroid-layer {
        bottom: 5%;
        right: 5%;
        width: 55%;
        z-index: 20;
        transform: rotate(8deg);
      }

      .polaroid-frame {
        background-color: var(--white-paper);
        padding: 12px 12px 35px 12px;
        box-shadow: 8px 12px 0px rgba(0, 0, 0, 0.5);
        border: 1px solid #ddd;
      }

      .polaroid-caption {
        display: block;
        color: #333;
        font-family: "Special Elite", monospace;
        font-size: 0.9rem;
        font-weight: bold;
        text-align: center;
        margin-top: 12px;
        transform: rotate(-1deg);
      }

      /* Layer 3: Foreground Main Character Cutout (Sticker Effect) */
      .character-layer {
        top: 5%;
        left: 20%;
        width: 65%;
        z-index: 30;
        transform: rotate(-2deg);
        /* Gives a thick white sticker outline to the PNG transparent character */
        filter: drop-shadow(4px 4px 0px var(--white-paper))
          drop-shadow(-4px -4px 0px var(--white-paper))
          drop-shadow(4px -4px 0px var(--white-paper))
          drop-shadow(-4px 4px 0px var(--white-paper))
          drop-shadow(8px 12px 0px rgba(0, 0, 0, 0.4));
      }

      /* Layer 4: Decorative Scribbles */
      .scribble-overlay {
        top: -5%;
        right: 15%;
        width: 35%;
        z-index: 40;
        pointer-events: none;
        transform: rotate(15deg);
        /* Uses CSS variable to pull Nijika's yellow or Bocchi's pink into the line */
        color: var(--yellow-nijika);
        filter: drop-shadow(2px 2px 0px var(--dark-punk));
        opacity: 0.85;
      }

      /* Frantic hand-drawn frame switcher animation */
      .anxious-scribble-svg {
        animation: scribble-shake 0.3s steps(2) infinite;
      }

      @keyframes scribble-shake {
        0% {
          transform: scale(1) rotate(0deg) skewX(0deg);
        }
        50% {
          transform: scale(1.05) rotate(3deg) skewX(-4deg);
        }
        100% {
          transform: scale(0.95) rotate(-3deg) skewX(4deg);
        }
      }
      /* Interactivity modifier: Make the lines pop to neon magenta when hovering the container */
      .hero-collage:hover .scribble-overlay {
        color: var(--neon-magenta);
        transform: rotate(25deg) scale(1.15);
        opacity: 1;
      }

      /* Subtle Hover Chaos Interactivity */
      .hero-collage:hover .poster-layer {
        transform: rotate(-4deg) scale(1.02);
      }
      .hero-collage:hover .polaroid-layer {
        transform: rotate(5deg) translate(-5px, -5px);
      }
      .hero-collage:hover .character-layer {
        transform: rotate(-1deg) scale(1.04);
      }
      /* ==========================================================================
     6. FIXed ZINE NAVIGATION (STICKER TAPE)
     ========================================================================== */
      .zine-nav {
        position: fixed;
        top: 15%;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        z-index: 100;
        transform: rotate(2deg);
      }

      @media (max-width: 768px) {
        .zine-nav {
          position: static;
          transform: none;
          padding: 1rem;
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          display: grid;
        }
      }

      .nav-sticker {
        color: var(--dark-punk);
        font-weight: 900;
        text-decoration: none;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        border: 2px solid var(--dark-punk);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        box-shadow: 4px 4px 0px var(--dark-punk);
      }

      .tape-pink {
        background-color: var(--pink-bocchi);
        transform: rotate(-3deg);
      }
      .tape-yellow {
        background-color: var(--yellow-nijika);
        transform: rotate(2deg);
      }
      .tape-purple {
        background-color: var(--purple-ryo);
        transform: rotate(-1deg);
      }
      .tape-blue {
        background-color: var(--blue-kita);
        transform: rotate(4deg);
      }
      .tape-white {
        background-color: var(--white-paper);
        transform: rotate(-2deg);
      }
      .tape-magenta {
        background-color: var(--neon-magenta);
        color: white;
        transform: rotate(1deg);
      }
      .tape-dark {
        background-color: var(--dark-punk);
        color: var(--yellow-nijika);
        transform: rotate(-4deg);
      }

      .nav-sticker:hover {
        transform: scale(1.1) rotate(0deg);
        box-shadow: 6px 6px 0px var(--neon-magenta);
      }
      /* ==========================================================================
     7. DASHBOARD MAIN HUB STRUCTURE
     ========================================================================== */
      .dashboard-grid {
        background-color: var(--white-paper);
        color: var(--dark-punk);
        padding: 6rem 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 3rem;
        max-width: 1300px;
        margin: 0 auto;
        position: relative;
      }

      /* Base Punk Zine Card Panel */
      .dashboard-card {
        background-color: white;
        border: 4px solid var(--dark-punk);
        padding: 2.5rem 1.5rem 1.5rem 1.5rem;
        position: relative;
        box-shadow: 8px 8px 0px var(--dark-punk);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .dashboard-card h2 {
        font-family: monospace;
        font-size: 1.8rem;
        text-transform: uppercase;
        margin-top: 0.5rem;
        margin-bottom: 1rem;
      }

      .card-desc {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #444;
        margin-bottom: 2rem;
      }

      /* Asymmetric Random Rotations for "Organic Chaos" */
      .alt-tilt {
        transform: rotate(-1.5deg);
      }
      .alt-tilt-2 {
        transform: rotate(1.2deg);
      }

      /* Absolute Corner Tag Elements */
      .card-tag {
        position: absolute;
        top: -12px;
        left: 15px;
        background-color: var(--dark-punk);
        color: var(--white-paper);
        font-size: 0.75rem;
        font-weight: bold;
        padding: 0.2rem 0.6rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .tag-magenta {
        background-color: var(--neon-magenta);
      }
      .tag-yellow {
        background-color: var(--yellow-nijika);
        color: var(--dark-punk);
      }
      .tag-blue {
        background-color: var(--blue-kita);
        color: var(--dark-punk);
      }

      /* Links Styled as Cutout Ticket Headers */
      .test-links {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }

      .zine-link {
        display: block;
        padding: 0.8rem;
        background-color: var(--white-paper);
        border: 2px solid var(--dark-punk);
        text-decoration: none;
        color: var(--dark-punk);
        font-weight: bold;
        font-size: 0.9rem;
        transition: all 0.1s ease;
      }

      .zine-link:hover {
        background-color: var(--pink-bocchi);
        transform: translate(-3px, -3px);
        box-shadow: 4px 4px 0px var(--dark-punk);
      }

      .py-accent:hover {
        background-color: var(--blue-kita);
      }
      .php-accent:hover {
        background-color: var(--purple-ryo);
      }
      /* ==========================================================================
     8. CONSOLE / EVALUATION WORKBENCH
     ========================================================================== */
      .venue-console {
        background-color: var(--dark-punk);
        color: var(--white-paper);
        margin: 4rem auto;
        max-width: 1200px;
        border: 3px solid var(--white-paper);
        box-shadow: 12px 12px 0px var(--purple-ryo);
        font-family: monospace;
      }

      .console-header {
        background-color: #222;
        padding: 0.6rem 1rem;
        border-bottom: 3px solid var(--white-paper);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .console-header span[class^="dot-"] {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot-red {
        background-color: #ff5f56;
      }
      .dot-yellow {
        background-color: #ffbd2e;
      }
      .dot-green {
        background-color: #27c93f;
      }

      .console-title {
        margin-left: 10px;
        font-size: 0.85rem;
        letter-spacing: 1px;
        color: #888;
      }

      .console-body {
        padding: 2rem;
      }

      .console-section h3 {
        color: var(--yellow-nijika);
        margin-bottom: 1.5rem;
        text-transform: uppercase;
      }

      .interactive-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .btn-console {
        background-color: #1e1e1e;
        color: var(--blue-kita);
        border: 1px solid var(--blue-kita);
        padding: 0.8rem 1.2rem;
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .btn-console:hover {
        background-color: var(--blue-kita);
        color: var(--dark-punk);
        box-shadow: 0 0 10px var(--blue-kita);
      }

      .console-divider {
        border: 0;
        border-top: 2px dashed #444;
        margin: 2.5rem 0;
      }

      /* Quick Session Interactive Area */
      .inline-login-box {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        max-width: 500px;
      }

      .console-input {
        background-color: #000;
        border: 2px solid var(--pink-bocchi);
        color: var(--pink-bocchi);
        padding: 0.6rem;
        flex: 1;
        font-family: monospace;
      }

      .btn-submit-console {
        background-color: var(--pink-bocchi);
        border: none;
        color: var(--dark-punk);
        font-weight: bold;
        padding: 0 1rem;
        cursor: pointer;
      }

      .btn-submit-console:hover {
        background-color: var(--neon-magenta);
        color: white;
      }
      /* ==========================================================================
     9. CHECKLIST FOOTER UTILITIES
     ========================================================================== */
      .eval-checklist-section {
        max-width: 800px;
        margin: 6rem auto 2rem auto;
        padding: 2rem;
        background-color: #fbf0b9; /* Aged vintage paper note style */
        color: #222;
        border: 3px dashed var(--dark-punk);
        position: relative;
      }

      .tape-header {
        position: absolute;
        top: -18px;
        left: 30%;
        background-color: var(--neon-magenta);
        color: white;
        padding: 0.4rem 1.5rem;
        font-weight: 900;
        transform: rotate(-1deg);
        box-shadow: 3px 3px 0px var(--dark-punk);
      }

      .checklist-box {
        list-style: none;
        padding: 0;
        font-family: monospace;
        font-size: 1.05rem;
      }

      .checklist-box li {
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checklist-box input[type="checkbox"] {
        accent-color: var(--dark-punk);
        width: 18px;
        height: 18px;
      }

      .signature-note {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: #666;
        text-align: right;
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <nav class="zine-nav" aria-label="Main Navigation">
      <a href="index.html" class="nav-sticker tape-pink">🎸 Main Posting</a>
      <a href="sites/song_request.html" class="nav-sticker tape-yellow"

    <header class="hero-section">
      <!-- Dynamic Halftone & Pattern Background Layer -->
      <div class="hero-bg-overlay" aria-hidden="true">
        <div class="halftone-pattern"></div>
        <div class="distressed-texture"></div>
      </div>

      <div class="hero-container">
        <!-- Left Column: Chaotic Typography & Call to Action -->
        <div class="hero-content">
          <div class="badge ransom-note">LIVE NOW</div>
          <h1 class="hero-title">
            <span class="text-layer-1">Kessoku</span>

          </p>
          <div class="hero-actions">
            <a href="sites/test_bench.html" class="btn btn-primary"
              >LAUNCH TEST BENCH</a
            >
            <a href="#gigs" class="btn btn-secondary">TOUR DATES</a>
          </div>
        </div>

        <!-- Right Column: Overlapping Collage Assets -->
        <div class="hero-collage">
          <!-- Background "Gig Poster" Cutout -->
          <div class="collage-item poster-layer">

            />
          </div>

          <!-- Midground "Polaroid" Frame -->
          <div class="collage-item polaroid-layer">
            <div class="polaroid-frame">
              <img
                src="sites/resources/kessoku_band.jpg"
                alt="Kessoku Band members laughing"
              />
              <span class="polaroid-caption">E2 - 2026</span>
            </div>
          </div>

          <!-- Foreground Main Character Cutout (Sticker Effect) -->
          <div class="collage-item character-layer">
            <img

          <!-- Decorative Screamtone / Scribble Overlay -->
          <div class="collage-item scribble-overlay" aria-hidden="true">
            <svg
              viewBox="0 0 200 200"
              xmlns="http://www.w3.org/2000/svg"
              class="anxious-scribble-svg"
            >
              <path
                d="M 100,10 
                  L 130,75  L 200,80  L 145,125 L 165,190 
                  L 100,150 L 35,190  L 55,125  L 0,80    L 70,75 
                  Z
                  M 102,8   L 163,193 L 2,82    L 198,82  L 37,193 Z"
                fill="none"
                stroke="currentColor"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>
      </div>
    </header>
