<!DOCTYPE html>
<html lang="en">
<style>
/* ==========================================================================
   1. VARIABLES & RESET
   ========================================================================== */
:root {
  --pink-bocchi: #ffb1cb;
  --blue-kita: #82e3f5;
  --yellow-nijika: #fff176;
  --purple-ryo: #b39ddb;
  --dark-punk: #121212;
  --white-paper: #f4f4f4;
  --neon-magenta: #ff007f;
}

.hero-section {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background-color: var(--dark-punk);
  color: var(--white-paper);
  overflow: hidden;
  display: flex;
  align-items: center;
  padding: 4rem 2rem;
  font-family: 'Courier New', Courier, monospace;
}

/* ==========================================================================
   2. TEXTURES & BACKGROUND LAYER
   ========================================================================== */
.hero-bg-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.15;
}

/* Simulated Halftone Pattern */
.halftone-pattern {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(var(--white-paper) 15%, transparent 16%);
  background-size: 12px 12px;
}

/* Gritty Grunge Line Texture */
.distressed-texture {
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(18,18,18,0) 50%, rgba(0,0,0,0.25) 50%),
              linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,255,0.02), rgba(0,0,255,0.06));
  background-size: 100% 4px, 6px 100%;
}

/* ==========================================================================
   3. LAYOUT CONTAINER
   ========================================================================== */
.hero-container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 4rem;
  align-items: center;
}

@media (min-width: 992px) {
  .hero-container {
    grid-template-columns: 1.2fr 1fr;
  }
}

/* ==========================================================================
   4. LEFT COLUMN: CHAOTIC TYPOGRAPHY
   ========================================================================== */
.hero-content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

/* Ransom Note Badge */
.ransom-note {
  background-color: var(--neon-magenta);
  color: var(--dark-punk);
  padding: 0.5rem 1rem;
  font-weight: 900;
  text-transform: uppercase;
  transform: rotate(-3deg);
  box-shadow: 4px 4px 0px var(--white-paper);
  margin-bottom: 2rem;
  font-size: 1.1rem;
}

/* Jagged Layered Title */
.hero-title {
  font-size: clamp(3.5rem, 8vw, 6rem);
  font-weight: 900;
  line-height: 0.85;
  text-transform: uppercase;
  margin-bottom: 2rem;
  display: flex;
  flex-direction: column;
}

.hero-title span {
  display: inline-block;
  width: max-content;
  padding: 0.2rem 0.8rem;
}

.text-layer-1 {
  background-color: var(--pink-bocchi);
  color: var(--dark-punk);
  transform: rotate(-1deg) skewX(-5deg);
}

.text-layer-2 {
  background-color: var(--white-paper);
  color: var(--dark-punk);
  transform: rotate(2deg) translateX(10px);
  border: 3px solid var(--dark-punk);
}

.text-layer-3 {
  background-color: var(--dark-punk);
  color: var(--blue-kita);
  text-shadow: 4px 4px 0px var(--neon-magenta);
  transform: rotate(-2deg) translateY(-5px);
}

.hero-description {
  font-size: 1.1rem;
  line-height: 1.6;
  max-width: 480px;
  margin-bottom: 2.5rem;
  color: #ccc;
  background: rgba(18, 18, 18, 0.7);
  padding: 0.5rem;
  border-left: 4px solid var(--purple-ryo);
}

/* Punk Rock Buttons */
.hero-actions {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.btn {
  display: inline-block;
  padding: 1rem 2rem;
  font-weight: bold;
  text-decoration: none;
  text-transform: uppercase;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.btn-primary {
  background-color: var(--yellow-nijika);
  color: var(--dark-punk);
  border: 3px solid var(--dark-punk);
  box-shadow: 5px 5px 0px var(--pink-bocchi);
}

.btn-secondary {
  background-color: transparent;
  color: var(--white-paper);
  border: 3px dashed var(--white-paper);
}

.btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0px var(--neon-magenta);
}

.btn:active {
  transform: translate(3px, 3px);
  box-shadow: 0px 0px 0px transparent;
}

/* ==========================================================================
   5. RIGHT COLUMN: OVERLAPPING COLLAGE (THE MAGIC)
   ========================================================================== */
.hero-collage {
  position: relative;
  width: 100%;
  height: 450px; /* Binds absolute items to a box container */
  margin-top: 2rem;
}

@media (min-width: 992px) {
  .hero-collage {
    height: 550px;
    margin-top: 0;
  }
}

.collage-item {
  position: absolute;
  transition: transform 0.3s ease;
}

.collage-item img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: cover;
}

/* Layer 1: Background Gig Poster */
.poster-layer {
  top: 10%;
  left: 5%;
  width: 75%;
  z-index: 10;
  transform: rotate(-6deg);
  filter: grayscale(1) contrast(1.5);
  border: 2px solid var(--dark-punk);
  /* Rough ripped paper clip path */
  clip-path: polygon(2% 0%, 98% 4%, 100% 94%, 95% 100%, 5% 98%, 0% 85%);
}

/* Layer 2: Midground Polaroid Frame */
.polaroid-layer {
  bottom: 5%;
  right: 5%;
  width: 55%;
  z-index: 20;
  transform: rotate(8deg);
}

.polaroid-frame {
  background-color: var(--white-paper);
  padding: 12px 12px 35px 12px;
  box-shadow: 8px 12px 0px rgba(0,0,0,0.5);
  border: 1px solid #ddd;
}

.polaroid-caption {
  display: block;
  color: #333;
  font-family: 'Special Elite', monospace;
  font-size: 0.9rem;
  font-weight: bold;
  text-align: center;
  margin-top: 12px;
  transform: rotate(-1deg);
}

/* Layer 3: Foreground Main Character Cutout (Sticker Effect) */
.character-layer {
  top: 5%;
  left: 20%;
  width: 65%;
  z-index: 30;
  transform: rotate(-2deg);
  /* Gives a thick white sticker outline to the PNG transparent character */
  filter: drop-shadow(4px 4px 0px var(--white-paper)) 
          drop-shadow(-4px -4px 0px var(--white-paper))
          drop-shadow(4px -4px 0px var(--white-paper))
          drop-shadow(-4px 4px 0px var(--white-paper))
          drop-shadow(8px 12px 0px rgba(0,0,0,0.4));
}

/* Layer 4: Decorative Scribbles */
.scribble-overlay {
  top: -5%;
  right: 15%;
  width: 30%;
  z-index: 40;
  pointer-events: none;
  transform: rotate(15deg);
  filter: invert(1); /* Turns black SVGs white to pop out */
}

/* Layer 5: Easter Egg Hidden Meltdown Blob */
.bocchi-blob-hidden {
  bottom: -10px;
  left: -20px;
  width: 90px;
  z-index: 50;
  transform: scale(0.9) rotate(-10deg);
}

/* Subtle Hover Chaos Interactivity */
.hero-collage:hover .poster-layer { transform: rotate(-4deg) scale(1.02); }
.hero-collage:hover .polaroid-layer { transform: rotate(5deg) translate(-5px, -5px); }
.hero-collage:hover .character-layer { transform: rotate(-1deg) scale(1.04); }
.hero-collage:hover .bocchi-blob-hidden { transform: scale(1.2) rotate(15deg); }
</style>

<header class="hero-section">
  <!-- Dynamic Halftone & Pattern Background Layer -->
  <div class="hero-bg-overlay" aria-hidden="true">
    <div class="halftone-pattern"></div>
    <div class="distressed-texture"></div>
  </div>

  <div class="hero-container">
    
    <!-- Left Column: Chaotic Typography & Call to Action -->
    <div class="hero-content">
      <div class="badge ransom-note">LIVE NOW</div>
      <h1 class="hero-title">
        <span class="text-layer-1">Kessoku</span>
        <span class="text-layer-2">STRIKES</span>
        <span class="text-layer-3">BACK.</span>
      </h1>
      <p class="hero-description">
        A chaotic blend of social anxiety and high-voltage indie rock. Step into the shelter.
      </p>
      <div class="hero-actions">
        <a href="#listen" class="btn btn-primary">LISTEN NOW</a>
        <a href="#gigs" class="btn btn-secondary">TOUR DATES</a>
      </div>
    </div>

    <!-- Right Column: Overlapping Collage Assets -->
    <div class="hero-collage">
      
      <!-- Background "Gig Poster" Cutout -->
      <div class="collage-item poster-layer">
        <img src="gig-poster-grunge.jpg" alt="Vintage punk rock gig poster background">
      </div>

      <!-- Midground "Polaroid" Frame -->
      <div class="collage-item polaroid-layer">
        <div class="polaroid-frame">
          <img src="band-photo.jpg" alt="Kessoku Band members laughing">
          <span class="polaroid-caption">STARRY - 2026</span>
        </div>
      </div>

      <!-- Foreground Main Character Cutout (Sticker Effect) -->
      <div class="collage-item character-layer">
        <img src="bocchi-guitar-shred.png" alt="Bocchi shredding on her Gibson Les Paul Custom guitar">
      </div>

      <!-- Decorative Screamtone / Scribble Overlay -->
      <div class="collage-item scribble-overlay" aria-hidden="true">
        <img src="hand-drawn-scribbles.svg" alt="">
      </div>

      <!-- Easter Egg: Hidden Meltdown Blob -->
      <div class="collage-item bocchi-blob-hidden" aria-hidden="true">
        <img src="bocchi-melting-face.png" alt="">
      </div>

    </div>

  </div>
</header>
</html>
